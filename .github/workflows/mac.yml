name: macOS build (VST3 + AU)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build universal + checks (DSP, validator, auval)
        id: universal
        continue-on-error: true
        run: CI=1 ./build-mac.sh
      - name: Fallback - Apple Silicon only
        if: steps.universal.outcome != 'success'
        run: |
          rm -rf build-mac dist-mac
          CI=1 ARCHS=arm64 ./build-mac.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DevRev-mac
          path: |
            dist-mac/DevRev-1.0-mac.zip
            dist-mac/validator.log
            dist-mac/auval.log
          if-no-files-found: error
      - name: Publish build to the mac-build branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pub && cp dist-mac/DevRev-1.0-mac.zip dist-mac/validator.log dist-mac/auval.log /tmp/pub/
          cd /tmp/pub
          git init -q -b mac-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "macOS build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mac-build
